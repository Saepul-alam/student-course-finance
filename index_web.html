<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>LMS & Tabungan</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --success: #0F9D58;
      --warning: #F4B400;
      --danger: #d93025;
      --purple: #9C27B0;
      --orange: #FF6D01;
      --green: #34A853;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #333;
      --text-light: #666;
      --border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, #1557b0 100%);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 0 10px;
      gap: 5px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      padding: 12px 15px;
      font-size: 0.9rem;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .nav a:hover, .nav a.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px;
    }

    .row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .col {
      flex: 1;
      min-width: 280px;
    }

    .col-2 { flex: 0 0 calc(50% - 7.5px); }
    .col-3 { flex: 0 0 calc(33.33% - 10px); }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 15px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-action {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .card-action:hover {
      text-decoration: underline;
    }

    /* Stats Cards */
    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 18px;
      box-shadow: var(--shadow);
      text-align: center;
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .stat-card.success .stat-value { color: var(--success); }
    .stat-card.warning .stat-value { color: #e65100; }
    .stat-card.danger .stat-value { color: var(--danger); }
    .stat-card.purple .stat-value { color: var(--purple); }

    /* Forms */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }

    .form-group label .required {
      color: var(--danger);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s;
      background: white;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover {
      background: #0b7a46;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: #b71c1c;
    }

    .btn-warning {
      background: var(--warning);
      color: #333;
    }

    .btn-warning:hover {
      background: #e6a800;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: rgba(26, 115, 232, 0.1);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    .btn-block {
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    /* Tables */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th {
      background: var(--primary);
      color: white;
      padding: 12px 10px;
      text-align: left;
      font-weight: 600;
      font-size: 0.9rem;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    tr:hover {
      background: #f8f9fa;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-success { background: #e8f5e9; color: #2e7d32; }
    .badge-warning { background: #fff3e0; color: #e65100; }
    .badge-danger { background: #ffebee; color: #c62828; }
    .badge-info { background: #e3f2fd; color: #1565c0; }

    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .text-muted { color: var(--text-light); }
    .fw-bold { font-weight: 700; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: white;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      color: var(--text);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-light);
      padding: 5px;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 15px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Alert */
    .alert {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #4caf50;
    }

    .alert-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #f44336;
    }

    .alert-info {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #2196f3;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    /* Balance card */
    .balance-card {
      background: linear-gradient(135deg, #0F9D58 0%, #0b7a46 100%);
      color: white;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      margin-bottom: 15px;
    }

    .balance-card .label {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 5px;
    }

    .balance-card .value {
      font-size: 2.5rem;
      font-weight: 700;
    }

    /* Transaction type indicator */
    .tx-type {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .tx-deposit {
      background: rgba(15, 157, 88, 0.15);
      color: var(--success);
    }

    .tx-withdraw {
      background: rgba(217, 48, 37, 0.15);
      color: var(--danger);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header h1 { font-size: 1.2rem; }
      .container { padding: 10px; }
      .col-2, .col-3 { flex: 0 0 100%; }
      .stat-value { font-size: 1.5rem; }
      .balance-card .value { font-size: 2rem; }
      .nav a { padding: 10px 12px; font-size: 0.85rem; }
      .btn { padding: 10px 18px; }
    }

    @media (max-width: 480px) {
      .form-row { flex-direction: column; }
      .btn-group { flex-direction: column; }
      .btn-group .btn { width: 100%; }
    }

    /* Print styles */
    @media print {
      .header { position: static; }
      .nav { display: none; }
      .card { box-shadow: none; border: 1px solid #ddd; }
      .btn, .modal-overlay { display: none; }
    }

    /* Slide animation for cards */
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #aaa; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>📚 LMS & Buku Tabungan</h1>
    <p>Sistem terintegrasi untuk manajemen murid dan tabungan</p>
  </header><!-- Navigation -->
<nav class="nav">
    <a href="#" data-page="dashboard" class="active">🏠 Dashboard</a>
    <a href="#" data-page="students">👨‍🎓 Murid</a>
    <a href="#" data-page="classes">🏫 Kelas</a>
    <a href="#" data-page="attendance">📝 Absensi</a>
    <a href="#" data-page="progress">📈 Progres</a>
    <a href="#" data-page="savings">💰 Tabungan</a>
    <a href="#" data-page="transactions">🧾 Transaksi</a>
    <a href="#" data-page="reports">📄 Laporan</a>
    <a href="#" data-page="settings">💬 WhatsApp</a>
  </nav>
  
  <!-- User Info Bar -->
  <div style="background:#f8f9fa; padding:10px 15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e0e0e0;">
    <span style="font-size:0.85rem; color:#666;">👤 <span id="user-email">Admin</span></span>
    <button class="btn btn-sm btn-outline" onclick="handleLogout()" style="font-size:0.8rem;">🚪 Logout</button>
  </div>

  <!-- Main Content -->
  <div class="container">
    <div id="content">
      <!-- Loading -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- Modal Container -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Modal Title</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Dynamic content -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <!-- Dynamic buttons -->
      </div>
    </div>
  </div>

  <script>
    // App State
    const state = {
      currentPage: 'dashboard',
      students: [],
      classes: [],
      loading: false
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      initNavigation();
      loadDashboard();
    });

    // Navigation
    function initNavigation() {
      document.querySelectorAll('.nav a').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const page = link.dataset.page;
          if (page && page !== state.currentPage) {
            loadPage(page);
          }
        });
      });
    }

    function loadPage(page) {
      state.currentPage = page;
      document.querySelectorAll('.nav a').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });
      closeModal();

      switch(page) {
        case 'dashboard': loadDashboard(); break;
        case 'students': loadStudents(); break;
        case 'classes': loadClasses(); break;
        case 'attendance': loadAttendance(); break;
        case 'progress': loadProgress(); break;
        case 'savings': loadSavings(); break;
        case 'transactions': loadTransactions(); break;
        case 'reports': loadReports(); break;
        case 'settings': loadWhatsAppSettingsPage(); break;
      }
    }

    // ==================== WHATSAPP SETTINGS ====================
    function loadWhatsAppSettingsPage() {
      document.getElementById('content').innerHTML = `
        <div class="fade-in">
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">💬 Notifikasi WhatsApp (Fonnte)</h2>
            </div>
            
            <div class="alert alert-info">
              <strong>📋 Cara Setup Fonnte:</strong><br>
              1. Daftar/login di <strong>fonnte.com</strong> (gratis untuk mulai)<br>
              2. Dashboard → salin <strong>Token API</strong><br>
              3. Scan QR code dengan WhatsApp yang akan jadi pengirim<br>
              4. Tempel token di bawah, aktifkan, lalu test kirim
            </div>
            
            <div id="wa-status" style="margin-bottom:15px;"></div>
            
            <div class="form-group">
              <label>🔑 Token Fonnte</label>
              <input type="password" id="waToken" placeholder="Tempel token dari dashboard Fonnte">
              <p style="font-size:0.8rem; color:#999; margin-top:5px;">
                Kosongkan jika tidak ingin mengganti. Token tersimpan aman di Script Properties.
              </p>
            </div>
            
            <div class="form-group">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:500;">
                <input type="checkbox" id="waEnabled" style="width:auto;">
                ✅ Aktifkan notifikasi WhatsApp
              </label>
            </div>
            
            <div class="form-group">
              <label>🧪 Nomor Test</label>
              <div style="display:flex; gap:10px;">
                <input type="tel" id="waTestNumber" placeholder="08xxxxxxxxxx" style="flex:1;">
                <button class="btn btn-outline" onclick="testWhatsAppNow()">Test Kirim</button>
              </div>
            </div>
            
            <div class="btn-group">
              <button class="btn btn-success" onclick="saveWhatsAppSettingsNow()">💾 Simpan Pengaturan</button>
            </div>
            
            <div style="margin-top:25px; padding:15px; background:#f8f9fa; border-radius:8px;">
              <p style="font-size:0.9rem; margin:0; color:#666;">
                <strong>ℹ️ Catatan:</strong> Nomor HP orang tua diambil dari kolom <strong>No HP</strong> di data murid.
                Format 08xx otomatis dikonversi ke 628xx. Pesan hanya terkirim jika checkbox
                "Kirim notifikasi WhatsApp" dicentang saat input absensi/transaksi.
              </p>
            </div>
          </div>
        </div>
      `;
      
      // Muat status saat ini
      google.script.run
        .withSuccessHandler(function(cfg) {
          document.getElementById('wa-status').innerHTML = `
            <div class="alert ${cfg.hasToken && cfg.enabled ? 'alert-success' : 'alert-info'}" style="margin-bottom:0;">
              Token: ${cfg.hasToken ? '✅ sudah diisi' : '❌ belum diisi'} · 
              Status: ${cfg.enabled ? '✅ AKTIF' : '⏸️ NONAKTIF'}
            </div>
          `;
          document.getElementById('waEnabled').checked = cfg.enabled;
        })
        .withFailureHandler(handleError)
        .getWhatsAppSettings();
    }
    
    function saveWhatsAppSettingsNow() {
      const token = document.getElementById('waToken').value.trim();
      const enabled = document.getElementById('waEnabled').checked;
      
      if (!token && !confirm('Token kosong — tetap simpan (hanya ubah status aktif)?')) return;
      
      showAlert('⏳ Menyimpan...', 'info');
      google.script.run
        .withSuccessHandler(function(result) {
          showAlert(result.message, 'success');
          document.getElementById('waToken').value = '';
          loadWhatsAppSettingsPage();
        })
        .withFailureHandler(function(err) { showAlert('Error: ' + err.message, 'error'); })
        .saveWhatsAppSettings(token, enabled);
    }
    
    function testWhatsAppNow() {
      const phone = document.getElementById('waTestNumber').value.trim();
      if (!phone) {
        showAlert('Isi nomor test terlebih dahulu!', 'error');
        return;
      }
      
      showAlert('⏳ Mengirim WhatsApp test...', 'info');
      google.script.run
        .withSuccessHandler(function(result) {
          showAlert(result.message, result.success ? 'success' : 'error');
        })
        .withFailureHandler(function(err) { showAlert('Error: ' + err.message, 'error'); })
        .testWhatsApp(phone);
    }

    // ==================== REPORTS ====================
    function loadReports() {
      document.getElementById('content').innerHTML = `
        <div class="fade-in">
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">📄 Laporan & Export</h2>
            </div>
            <p class="text-muted" style="margin-bottom:20px;">
              Pilih jenis laporan yang ingin dibuat. Laporan akan dibuka di jendela print —
              pilih <strong>Save as PDF</strong> untuk menyimpan sebagai file PDF.
            </p>
            
            <div class="row">
              <div class="col-2">
                <div class="stat-card" style="cursor:pointer;" onclick="generateReport('absensi')">
                  <div class="stat-icon">📝</div>
                  <h3 style="margin:10px 0 5px;">Laporan Absensi</h3>
                  <p style="font-size:0.85rem; color:#666;">Riwayat kehadiran semua murid + ringkasan Hadir/Sakit/Alpha</p>
                  <button class="btn btn-primary btn-sm" style="margin-top:12px;">📄 Generate</button>
                </div>
              </div>
              <div class="col-2">
                <div class="stat-card" style="cursor:pointer;" onclick="generateReport('tabungan')">
                  <div class="stat-icon">💰</div>
                  <h3 style="margin:10px 0 5px;">Laporan Tabungan</h3>
                  <p style="font-size:0.85rem; color:#666;">Rekening per murid + riwayat transaksi terakhir</p>
                  <button class="btn btn-success btn-sm" style="margin-top:12px;">📄 Generate</button>
                </div>
              </div>
            </div>
            
            <div class="row" style="margin-top:15px;">
              <div class="col-2">
                <div class="stat-card" style="cursor:pointer;" onclick="showStudentReportPicker()">
                  <div class="stat-icon">👤</div>
                  <h3 style="margin:10px 0 5px;">Laporan Per Murid</h3>
                  <p style="font-size:0.85rem; color:#666;">Laporan lengkap satu murid: data, tabungan, absensi, progres</p>
                  <button class="btn btn-primary btn-sm" style="margin-top:12px;">📄 Pilih Murid</button>
                </div>
              </div>
              <div class="col-2">
                <div class="stat-card" style="cursor:pointer;" onclick="showClassReportPicker()">
                  <div class="stat-icon">🏫</div>
                  <h3 style="margin:10px 0 5px;">Laporan Per Kelas</h3>
                  <p style="font-size:0.85rem; color:#666;">Daftar murid per kelas + statistik + riwayat absensi</p>
                  <button class="btn btn-success btn-sm" style="margin-top:12px;">📄 Pilih Kelas</button>
                </div>
              </div>
            </div>
            
            <div style="margin-top:25px; padding:15px; background:#e8f0fe; border-radius:8px;">
              <p style="font-size:0.9rem; margin:0;">
                <strong>💡 Cara Export PDF:</strong> Setelah laporan terbuka, tekan 
                <strong>Ctrl+P</strong> (Windows) atau <strong>Cmd+P</strong> (Mac), lalu pilih 
                <strong>Save as PDF</strong> sebagai tujuan cetak.
              </p>

    // ==================== TREND CHART (SVG, tanpa library) ====================
    function loadTrendChart(days) {
      [7, 30, 90].forEach(d => {
        const btn = document.getElementById('trend-btn-' + d);
        if (btn) btn.classList.toggle('btn-primary', d === days);
      });

      google.script.run
        .withSuccessHandler(renderTrendChart)
        .withFailureHandler(function(err) {
          document.getElementById('trend-chart').innerHTML = '<p class="text-muted" style="text-align:center;">Gagal memuat grafik</p>';
        })
        .getSavingsTrend(days);
    }
    
    function renderTrendChart(trend) {
      const data = trend.data || [];
      const chartEl = document.getElementById('trend-chart');
      const summaryEl = document.getElementById('trend-summary');
      
      if (data.length < 2) {
        chartEl.innerHTML = '<p class="text-muted" style="text-align:center;">Data belum cukup untuk grafik</p>';
        summaryEl.innerHTML = '';
        return;
      }
      
      // Summary
      const changeColor = trend.change >= 0 ? 'var(--success)' : 'var(--danger)';
      const changeIcon = trend.change >= 0 ? '📈' : '📉';
      summaryEl.innerHTML = `
        <div style="display:flex; gap:15px; flex-wrap:wrap;">
          <span style="font-size:0.9rem; color:#666;">Periode: <strong>${trend.days} hari</strong></span>
          <span style="font-size:0.9rem; color:#666;">Perubahan: 
            <strong style="color:${changeColor};">${changeIcon} ${trend.change >= 0 ? '+' : ''}Rp ${formatCurrency(trend.change)}</strong>
          </span>
          <span style="font-size:0.9rem; color:#666;">Saldo: <strong>Rp ${formatCurrency(trend.endTotal)}</strong></span>
        </div>
      `;
      
      // SVG line chart
      const W = 800, H = 260, P = { top: 20, right: 20, bottom: 40, left: 70 };
      const values = data.map(d => Number(d.total) || 0);
      const vMin = Math.min(...values, 0);
      const vMax = Math.max(...values, 1);
      const range = (vMax - vMin) || 1;
      
      const x = (i) => P.left + (i / (data.length - 1)) * (W - P.left - P.right);
      const y = (v) => P.top + (1 - (v - vMin) / range) * (H - P.top - P.bottom);
      
      const linePoints = data.map((d, i) => `${x(i)},${y(values[i])}`).join(' ');
      const areaPoints = `${P.left},${y(vMin)} ${linePoints} ${x(data.length - 1)},${y(vMin)}`;
      
      // Gridlines (4 garis) + label Y
      let gridLines = '';
      for (let g = 0; g <= 4; g++) {
        const gv = vMin + (range * g / 4);
        const gy = y(gv);
        gridLines += `
          <line x1="${P.left}" y1="${gy}" x2="${W - P.right}" y2="${gy}" stroke="#e0e0e0" stroke-width="1"/>
          <text x="${P.left - 8}" y="${gy + 4}" text-anchor="end" font-size="11" fill="#999">${formatCompact(gv)}</text>
        `;
      }
      
      // Label X (maks 6 label)
      const labelStep = Math.max(1, Math.ceil(data.length / 6));
      let xLabels = '';
      data.forEach((d, i) => {
        if (i % labelStep === 0 || i === data.length - 1) {
          xLabels += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#999">${d.label}</text>`;
        }
      });
      
      const lastVal = values[values.length - 1];
      
      chartEl.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1a73e8" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#1a73e8" stop-opacity="0.02"/>
            </linearGradient>
          </defs>
          ${gridLines}
          <polygon points="${areaPoints}" fill="url(#trendGrad)"/>
          <polyline points="${linePoints}" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${x(data.length - 1)}" cy="${y(lastVal)}" r="5" fill="#1a73e8" stroke="white" stroke-width="2"/>
          ${xLabels}
        </svg>
      `;
    }
    
    function formatCompact(v) {
      if (v >= 1000000000) return (v / 1000000000).toFixed(1) + 'M';
      if (v >= 1000000) return (v / 1000000).toFixed(1) + 'jt';
      if (v >= 1000) return Math.round(v / 1000) + 'rb';
      return Math.round(v);
    }

        </form>
      `, `
        <button class="btn btn-warning" onclick="closeModal()">Batal</button>
        <button class="btn btn-success btn-block" onclick="submitProgress(event)">✅ Simpan Progres</button>
      `);
    }

    function submitProgress(e) {
      e.preventDefault();
      const data = {
        studentId: document.getElementById('progressStudentId').value,
        mapel: document.getElementById('progressMapel').value,
        topik: document.getElementById('progressTopik').value,
        nilai: parseFloat(document.getElementById('progressNilai').value) || 0,
        deskripsi: document.getElementById('progressDeskripsi').value,
        guru: document.getElementById('progressGuru').value
      };

      google.script.run
        .withSuccessHandler((result) => {
          closeModal();
          showAlert(result.message, 'success');
        })
        .withFailureHandler((err) => showAlert('Error: ' + err.message, 'error'))
        .addProgress(data);
    }

    // ==================== SAVINGS ====================
    function loadSavings() {
      showLoading();
      google.script.run
        .withSuccessHandler(renderSavings)
        .withFailureHandler(handleError)
        .getSavingsAccounts();
    }

    function renderSavings(accounts) {
      hideLoading();
      state.savingsAccounts = accounts || [];

      document.getElementById('content').innerHTML = `
        <div class="fade-in">
          <div class="card-header" style="margin-bottom:0; padding-bottom:0; border-bottom:none;">
            <h2 class="card-title" style="margin-bottom:0;">💰 Rekening Tabungan</h2>
            <button class="btn btn-primary" onclick="openTransactionModal()">➕ Transaksi</button>
          </div>
          
          <div class="row" style="margin-top:20px;">
            <div class="col-2">
              <div class="stat-card success">
                <div class="stat-icon">🏦</div>
                <div class="stat-value">${accounts.length}</div>
                <div class="stat-label">Total Rekening</div>
              </div>
            </div>
            <div class="col-2">
              <div class="stat-card success">
                <div class="stat-icon">💰</div>
                <div class="stat-value">${formatCurrency(accounts.reduce((sum, a) => sum + Number(a.balance), 0))}</div>
                <div class="stat-label">Total Saldo</div>
              </div>
            </div>
            <div class="col-2">
              <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value">${accounts.filter(a => Number(a.balance) > 0).length}</div>
                <div class="stat-label">Punya Saldo</div>
              </div>
            </div>
            <div class="col-2">
              <div class="stat-card">
                <div class="stat-icon">⏸️</div>
                <div class="stat-value">${accounts.filter(a => Number(a.balance) === 0).length}</div>
                <div class="stat-label">Belum Ada Setoran</div>
              </div>
            </div>
          </div>

          <div class="table-wrapper" style="margin-top:15px;">
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>Nama Murid</th>
                  <th>ID Tabungan</th>
                  <th>Saldo</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${accounts.map((acc, i) => `
                  <tr>
                    <td class="text-center">${i + 1}</td>
                    <td class="fw-bold">${acc.studentName}</td>
                    <td class="text-muted" style="font-family:monospace;">${acc.id}</td>
                    <td class="text-right fw-bold">
                      ${Number(acc.balance) > 0 ? '💰 Rp ' + formatCurrency(acc.balance) : '<span style="color:#999;">Rp 0</span>'}
                    </td>
                    <td>
                      <span class="badge ${Number(acc.balance) > 0 ? 'badge-success' : 'badge-info'}">
                        ${Number(acc.balance) > 0 ? 'Aktif' : 'Belum Setor'}
                      </span>
                    </td>
                    <td>
                      <button class="btn btn-sm btn-outline" onclick="viewSavings('${acc.id}')">👁️</button>
                      <button class="btn btn-sm btn-warning" onclick="openTransactionForAccount('${acc.id}')">💰</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function viewSavings(id) {
      const account = state.savingsAccounts.find(a => a.id === id);
      if (!account) return;

      // Kirim account object ke render function (id tidak bisa diakses di sana)
      google.script.run
        .withSuccessHandler(function(transactions) {
          renderSavingsDetail(account, transactions);
        })
        .getTransactionsByStudent(account.studentId);
    }

    function renderSavingsDetail(account, transactions) {
      openModal(`💰 ${account?.studentName || 'Rekening'}`, `
        <div class="balance-card" style="margin-bottom:20px;">
          <div class="label">Saldo Saat Ini</div>
          <div class="value">${formatCurrency(account?.balance || 0)}</div>
        </div>

        <h4 style="margin-bottom:15px;">🧾 Riwayat Transaksi</h4>
        ${transactions.length > 0 ? `
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Tanggal</th>
                  <th>Jenis</th>
                  <th class="text-right">Jumlah</th>
                  <th class="text-right">Saldo</th>
                  <th>Waktu</th>
                  <th>Catatan</th>
                </tr>
              </thead>
              <tbody>
                ${transactions.map(tx => `
                  <tr>
                    <td class="text-muted">${new Date(tx.tanggal).toLocaleDateString('id-ID')}</td>
                    <td>
                      <span class="tx-type ${tx.jenis === 'Setoran' ? 'tx-deposit' : 'tx-withdraw'}">
                        ${tx.jenis === 'Setoran' ? '💰' : '💸'} ${tx.jenis}
                      </span>
                    </td>
                    <td class="text-right ${tx.jenis === 'Setoran' ? 'text-success fw-bold' : 'text-danger fw-bold'}">
                      ${tx.jenis === 'Setoran' ? '+' : '-'} Rp ${formatCurrency(tx.jumlah)}
                    </td>
                    <td class="text-right">${formatCurrency(tx.saldoSetelah)}</td>
                    <td class="text-muted" style="font-size:0.85rem;">${new Date(tx.waktu).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</td>
                    <td class="text-muted">${tx.catatan || '-'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : '<p class="text-muted" style="text-align:center;">Belum ada transaksi</p>'}
      `, `
        <button class="btn btn-warning" onclick="closeModal()">Tutup</button>
        <button class="btn btn-primary" onclick="closeModal(); openTransactionForAccount('${account.id}')">💰 Transaksi</button>
      `);
    }

    // ==================== TRANSACTIONS ====================
    function loadTransactions() {
      showLoading();
      google.script.run
        .withSuccessHandler(function(students) {
          state.students = students;
          google.script.run
            .withSuccessHandler(function(transactions) {
              renderTransactions(transactions);
            })
            .withFailureHandler(handleError)
            .getAllTransactions();
        })
        .withFailureHandler(handleError)
        .getStudents();
    }

    function renderTransactions(transactions) {
      hideLoading();

      document.getElementById('content').innerHTML = `
        <div class="fade-in">
          <div class="card-header" style="margin-bottom:0; padding-bottom:0; border-bottom:none;">
            <h2 class="card-title" style="margin-bottom:0;">🧾 Riwayat Transaksi</h2>
            <button class="btn btn-primary" onclick="openTransactionModal()">➕ Tambah Transaksi</button>
          </div>

          ${transactions.length > 0 ? `
            <div class="table-wrapper" style="margin-top:15px;">
              <table>
                <thead>
                  <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Nama Murid</th>
                    <th>Jenis</th>
                    <th class="text-right">Jumlah</th>
                    <th class="text-right">Saldo Setelah</th>
                    <th>Catatan</th>
                  </tr>
                </thead>
                <tbody>
                  ${transactions.map((t, i) => `
                    <tr>
                      <td class="text-center">${i + 1}</td>
                      <td class="text-muted">${new Date(t.tanggal).toLocaleDateString('id-ID')} ${new Date(t.waktu || t.tanggal).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</td>
                      <td class="fw-bold">${t.nama}</td>
                      <td>
                        <span class="tx-type ${t.jenis === 'Setoran' ? 'tx-deposit' : 'tx-withdraw'}">
                          ${t.jenis === 'Setoran' ? '💰' : '💸'} ${t.jenis}
                        </span>
                      </td>
                      <td class="text-right ${t.jenis === 'Setoran' ? 'text-success fw-bold' : 'text-danger fw-bold'}">
                        ${t.jenis === 'Setoran' ? '+' : '-'} Rp ${formatCurrency(t.jumlah)}
                      </td>
                      <td class="text-right">${formatCurrency(t.saldoSetelah)}</td>
                      <td class="text-muted">${t.catatan || '-'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : `
            <div class="empty-state" style="padding:30px; margin-top:15px;">
              <div class="icon">🧾</div>
              <h3>Belum ada transaksi</h3>
              <p style="margin-top:10px;">Mulai dengan transaksi pertama!</p>
              <button class="btn btn-primary" style="margin-top:15px;" onclick="openTransactionModal()">💰 Tambah Transaksi</button>
            </div>
          `}
        </div>
      `;
    }

    function loadTransactionsLegacy() {
      document.getElementById('content').innerHTML = `
        <div class="card fade-in">
          <div class="card-header">
            <h2 class="card-title">🧾 Riwayat Transaksi</h2>
            <button class="btn btn-primary" onclick="openTransactionModal()">➕ Tambah Transaksi</button>
          </div>
          <div class="empty-state" style="padding:30px;">
            <p>Untuk melihat semua transaksi, pilih menu Transaksi Tabungan dari halaman murid.</p>
            <button class="btn btn-primary" style="margin-top:15px;" onclick="loadSavings()">💰 Lihat Tabungan</button>
          </div>
        </div>
      `;
    }

    function openTransactionModal() {
      const students = state.students.filter(s => s.status === 'Aktif');
      const studentOptions = students.map(s => 
        `<option value="${s.id}">${s.nama} (${s.kelasNama})</option>`
      ).join('') || '<option value="">-- Pilih Murid --</option>';

      openModal('💰 Transaksi Tabungan', `
        <form id="transaction-form" onsubmit="submitTransaction(event)">
          <div class="form-group">
            <label>Pilih Murid <span class="required">*</span></label>
            <select id="txStudentId" required onchange="updateSavingsPreview()">
              <option value="">-- Pilih Murid --</option>
              ${studentOptions}
            </select>
          </div>
          <div class="form-group">
            <label>ID Tabungan</label>
            <input type="text" id="txSavingsId" readonly style="background:#f5f5f5; font-family:monospace;">
          </div>
          <div class="form-group">
            <label>Jenis Transaksi <span class="required">*</span></label>
            <select id="txType" required onchange="updateSavingsPreview()">
              <option value="Setoran">💰 Setoran (Tabung)</option>
              <option value="Penarikan">💸 Penarikan (Ambil)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Jumlah (Rp) <span class="required">*</span></label>
            <input type="number" id="txAmount" min="1" required placeholder="0">
          </div>
          <div class="card" style="background:#f0f7ff;">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
              <span>💳 Saldo Saat Ini:</span>
              <span class="fw-bold" id="currentBalancePreview">Rp 0</span>
            </div>
            <div style="display:flex; justify-content:space-between; padding-top:10px; border-top:1px solid #e0e0e0;">
              <span>📊 Saldo Setelah:</span>
              <span class="fw-bold" id="newBalancePreview" style="color:${'var(--primary)'};">Rp 0</span>
            </div>
          </div>
          <div class="form-group">
            <label>Catatan</label>
            <textarea id="txNote" placeholder="Contoh: Uang jajan bulan Januari"></textarea>
          </div>
          <div class="form-group">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:500;">
              <input type="checkbox" id="txNotifyParent" style="width:auto;">
              📧 Kirim notifikasi email ke orang tua
            </label>
          </div>
          <div class="form-group">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:500;">
              <input type="checkbox" id="txNotifyWhatsApp" style="width:auto;">
              💬 Kirim notifikasi WhatsApp ke orang tua
            </label>
          </div>
        </form>
      `, `
        <button class="btn btn-warning" onclick="closeModal()">Batal</button>
        <button class="btn btn-success btn-block" onclick="submitTransaction(event)">✅ Proses Transaksi</button>
      `);
    }

    function updateSavingsPreview() {
      const studentId = document.getElementById('txStudentId').value;
      const savingsIdEl = document.getElementById('txSavingsId');
      const previewEl = document.getElementById('currentBalancePreview');

      if (!studentId) {
        savingsIdEl.value = '';
        previewEl.textContent = 'Rp 0';
        return;
      }

      google.script.run
        .withSuccessHandler((student) => {
          if (student) {
            savingsIdEl.value = student.savingsId;
            state.currentTxSavingsId = student.savingsId;
            updateBalancePreview();
          }
        })
        .withFailureHandler(() => {
          savingsIdEl.value = 'Error';
        })
        .getStudent(studentId);
    }

    function updateBalancePreview() {
      const savingsId = state.currentTxSavingsId;
      const balanceEl = document.getElementById('currentBalancePreview');
      const newBalanceEl = document.getElementById('newBalancePreview');
      const amount = parseInt(document.getElementById('txAmount').value) || 0;
      const type = document.getElementById('txType').value;

      google.script.run
        .withSuccessHandler((balance) => {
          balanceEl.textContent = 'Rp ' + formatCurrency(balance);
          const newBalance = type === 'Setoran' ? balance + amount : balance - amount;
          newBalanceEl.textContent = 'Rp ' + formatCurrency(newBalance);
          newBalanceEl.style.color = newBalance < 0 ? 'var(--danger)' : 'var(--primary)';
        })
        .getBalance(savingsId);
    }

    // Override addTransaction to handle web
    function submitTransaction(e) {
      e.preventDefault();
      
      const studentId = document.getElementById('txStudentId').value;
      const savingsId = state.currentTxSavingsId;
      const jenis = document.getElementById('txType').value;
      const jumlah = parseInt(document.getElementById('txAmount').value) || 0;
      const catatan = document.getElementById('txNote').value;
      const notifyParent = document.getElementById('txNotifyParent') ? document.getElementById('txNotifyParent').checked : false;
      const notifyWhatsApp = document.getElementById('txNotifyWhatsApp') ? document.getElementById('txNotifyWhatsApp').checked : false;

      if (!savingsId) {
        showAlert('Pilih murid terlebih dahulu!', 'error');
        return;
      }

      google.script.run
        .withSuccessHandler((result) => {
          closeModal();
          showAlert(result.message, result.success ? 'success' : 'error');
          loadSavings();
          if (result.success) {
            loadDashboard();
          }
        })
        .withFailureHandler((err) => showAlert('Error: ' + err.message, 'error'))
        .addTransaction({
          studentId,
          savingsId,
          jenis,
          jumlah,
          catatan,
          notifyParent,
          notifyWhatsApp
        });
    }

    function openTransactionForAccount(savingsId) {
      const account = state.savingsAccounts.find(a => a.id === savingsId);
      if (!account) return;

      google.script.run
        .withSuccessHandler((student) => {
          const studentOptions = state.students
            .filter(s => s.id === student.id)
            .map(s => `<option value="${s.id}" selected>${s.nama} (${s.kelasNama})</option>`)
            .join('') || '<option value="">-- Pilih Murid --</option>';

          openModal('💰 Transaksi - ' + (account.studentName || 'Rekening'), `
            <form id="tx-form" onsubmit="submitQuickTx(event)">
              <input type="hidden" id="quickStudentId" value="${student.id}">
              <input type="hidden" id="quickSavingsId" value="${savingsId}">
              <div class="card" style="background:#e8f5e9; margin-bottom:15px;">
                <div style="display:flex; justify-content:space-between;">
                  <span>👤 Murid:</span>
                  <strong>${account.studentName || 'Unknown'}</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:5px;">
                  <span>💰 Saldo:</span>
                  <strong style="font-size:1.2rem;">Rp ${formatCurrency(account.balance)}</strong>
                </div>
              </div>
              <div class="form-group">
                <label>Jenis <span class="required">*</span></label>
                <select id="quickType" required>
                  <option value="Setoran">💰 Setoran</option>
                  <option value="Penarikan">💸 Penarikan</option>
                </select>
              </div>
              <div class="form-group">
                <label>Jumlah <span class="required">*</span></label>
                <input type="number" id="quickAmount" min="1" required placeholder="0">
              </div>
              <div class="form-group">
                <label>Catatan</label>
                <input type="text" id="quickNote" placeholder="Opsional">
              </div>
              <div class="form-group">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:500;">
                  <input type="checkbox" id="quickNotifyParent" style="width:auto;">
                  📧 Kirim notifikasi email ke orang tua
                </label>
              </div>
              <div class="form-group">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:500;">
                  <input type="checkbox" id="quickNotifyWhatsApp" style="width:auto;">
                  💬 Kirim notifikasi WhatsApp ke orang tua
                </label>
              </div>
            </form>
          `, `
            <button class="btn btn-warning" onclick="closeModal()">Batal</button>
            <button class="btn btn-success btn-block" onclick="submitQuickTx(event)">✅ Proses</button>
          `);
        })
        .withFailureHandler(() => showAlert('Error memuat data murid', 'error'))
        .getStudent(account.studentId);
    }

    function submitQuickTx(e) {
      e.preventDefault();
      const data = {
        studentId: document.getElementById('quickStudentId').value,
        savingsId: document.getElementById('quickSavingsId').value,
        jenis: document.getElementById('quickType').value,
        jumlah: parseInt(document.getElementById('quickAmount').value) || 0,
        catatan: document.getElementById('quickNote').value,
        notifyParent: document.getElementById('quickNotifyParent').checked,
        notifyWhatsApp: document.getElementById('quickNotifyWhatsApp').checked
      };

      google.script.run
        .withSuccessHandler((result) => {
          closeModal();
          showAlert(result.message, result.success ? 'success' : 'error');
          loadSavings();
          if (result.success) {
            loadDashboard();
          }
        })
        .withFailureHandler((err) => showAlert('Error: ' + err.message, 'error'))
        .addTransaction(data);
    }

    // ==================== HELPER FUNCTIONS ====================
    function formatCurrency(amount) {
      return Number(amount).toLocaleString('id-ID');
    }

    function getStatusBadge(status) {
      switch(status) {
        case 'Hadir': return 'badge-success';
        case 'Sakit': case 'Izin': return 'badge-warning';
        case 'Alpha': return 'badge-danger';
        default: return 'badge-info';
      }
    }

    function getStatusIcon(status) {
      switch(status) {
        case 'Hadir': return '✅';
        case 'Sakit': return '🤒';
        case 'Izin': return '📝';
        case 'Alpha': return '❌';
        default: return '';
      }
    }

    function handleError(error) {
      hideLoading();
      showAlert('Error: ' + (error.message || 'Terjadi kesalahan'), 'error');
      console.error(error);
    }

    // Catatan: Semua akses data dilakukan via google.script.run (server-side).
    // Fungsi server: getSavingsAccounts(), getStudents(), getClasses(), getBalance(), dst.
    // di Code.gs. Jangan panggil SpreadsheetApp langsung dari sisi client!

    // Expose for HTML forms (server-side functions)
    function getClassesForForm() {
      return getClasses();
    }

    function getStudentsForForm() {
      return getStudents().filter(s => s.status === 'Aktif');
    }
  </script>
</body>
</html>
