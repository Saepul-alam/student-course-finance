<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LMS & Tabungan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .login-header h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .login-header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .login-body {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }

    .error-msg {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #1a73e8;
      color: white;
    }

    .btn-primary:hover {
      background: #1557b0;
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer {
      padding: 20px 30px;
      background: #f5f5f5;
      text-align: center;
      font-size: 0.85rem;
      color: #666;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #e0e0e0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>📚 LMS & Tabungan</h1>
      <p>Silakan login untuk melanjutkan</p>
    </div>
    
    <div class="login-body">
      <div id="error-msg" class="error-msg"></div>
      
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Google <span style="color:#d93025;">*</span></label>
          <input type="email" id="email" required placeholder="email@sekolah.com" autocomplete="email">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password">
          <p style="font-size:0.8rem; color:#999; margin-top:5px;">
            (Opsional - untuk login hanya email saja)
          </p>
        </div>
        
        <button type="submit" class="btn btn-primary" id="login-btn">
          🔐 Login
        </button>
      </form>
      
      <div style="margin-top:20px; padding:15px; background:#e8f5e9; border-radius:8px;">
        <p style="font-size:0.85rem; color:#2e7d32; margin:0;">
          <strong>💡 Tips:</strong> Gunakan email Google yang sudah didaftarkan sebagai admin.
          Akses web app terbatas untuk pengguna terotorisasi.
        </p>
      </div>
    </div>
    
    <div class="login-footer">
      <p>LMS & Buku Tabungan System</p>
    </div>
  </div>

  <script>
    // Cek apakah sudah login dari parameter URL
    const urlParams = new URLSearchParams(window.location.search);
    const user = urlParams.get('user');
    
    if (user) {
      // Redirect ke aplikasi utama
      window.location.href = '?user=' + encodeURIComponent(user);
    }
    
    function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const btn = document.getElementById('login-btn');
      const errorMsg = document.getElementById('error-msg');
      
      btn.disabled = true;
      btn.textContent = '⏳ Memproses...';
      errorMsg.style.display = 'none';
      
      // Kirim ke Google Apps Script untuk verifikasi
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            // Redirect ke aplikasi utama dengan parameter user
            window.location.href = '?user=' + encodeURIComponent(email);
          } else {
            btn.disabled = false;
            btn.textContent = '🔐 Login';
            errorMsg.textContent = result.message || 'Email tidak terdaftar!';
            errorMsg.style.display = 'block';
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = '🔐 Login';
          errorMsg.textContent = 'Terjadi kesalahan: ' + err.message;
          errorMsg.style.display = 'block';
        })
        .verifyLogin(email);
    }
    
    // Auto-focus pada input
    document.getElementById('email').focus();
  </script>
</body>
</html>
